# pancra.conf --- THE DEPLOYMENT CONTRACT, in one file.
#
# Sourced by every script that talks to the deployed server: deploy.sh,
# rollback.sh, restore.sh, rotate.sh, backup.sh and the smoke test. Nothing
# else may name a path on the board.
#
# It exists because those paths were written out by hand in one script and
# nowhere else: srv/test/duosmoke.sh spelled the board's directory out three
# times -- for the executable, the pid file and the log -- naming the tree the
# server was installed into before it was called Pancra, while there was no
# install procedure to compare it against and nothing else in the repository
# said where anything lived. A path that appears in exactly one place, in a
# test, IS the deployment contract, and it is one nobody can check.
#
# EVERY VALUE HERE IS OVERRIDABLE from the environment, so a second board, a
# staging instance or somebody else's machine needs no edit to this file:
#
#     PANCRA_HOST=duo2 PANCRA_ROOT=/srv/pancra ./srv/deploy/deploy.sh
#
# THE ROOT IS PANCRA'S. The server was installed under its previous name and
# ran from a directory named after it for months; this file kept that name as
# a default, with a paragraph explaining why, which is how an obsolete path
# becomes permanent. The contract now says what the service IS.
#
# A BOARD STILL ON THE OLD TREE is one override away, and the move has a
# procedure: see README.md, "Moving the root". Do not point the default back
# at it -- the whole value of one contract is that it says one thing.

# WHERE. An ssh destination, so ~/.ssh/config decides the user, port and key.
PANCRA_HOST=${PANCRA_HOST:-duo}
PANCRA_SSH=${PANCRA_SSH:-ssh}
PANCRA_SCP=${PANCRA_SCP:-scp}

# WHAT IS INSTALLED, and where its state lives. The data directory is separate
# from the binary on purpose: a rollback replaces the executable and must not
# touch the database.
PANCRA_ROOT=${PANCRA_ROOT:-/home/jk/pancra}
PANCRA_BIN=${PANCRA_BIN:-$PANCRA_ROOT/sync}
PANCRA_DATA=${PANCRA_DATA:-$PANCRA_ROOT}
PANCRA_DB=${PANCRA_DB:-$PANCRA_DATA/sync.db}
# Previous executables, kept so a rollback needs no build and no network.
PANCRA_RELEASES=${PANCRA_RELEASES:-$PANCRA_ROOT/releases}
PANCRA_BACKUPS=${PANCRA_BACKUPS:-$PANCRA_ROOT/backups}

# HOW IT RUNS. The pid file and the log are written by the start command in
# start.sh -- the ONE place it exists, for every verb -- and read by the health
# check in health.sh. One definition, both uses.
PANCRA_PID=${PANCRA_PID:-$PANCRA_ROOT/sync.pid}
# ...AND WHAT THAT NUMBER WAS, WHEN IT WAS WRITTEN. A pid is not an identity:
# it is an index into a table the kernel reuses, and it is reused soonest
# exactly when this deployment most needs it -- after a crash, and after a
# reboot, where the low numbers go straight back out to ntpd, dropbear and the
# board's own sensor logger. Every stop in srv/deploy/start.sh used to send
# TERM and then KILL to whatever number was in the file above, so the procedure
# that recovers a dead service was also the one that could shoot a bystander.
#
# So the start records what it started BESIDE the number: the sha256 of the
# executable it launched, and the process's own start time out of
# /proc/<pid>/stat. The stop re-reads both from the live process and signals
# only when they agree. Written by start_block and read by stop_block --
# srv/deploy/start.sh, the one place either exists.
PANCRA_PID_ID=${PANCRA_PID_ID:-$PANCRA_PID.id}
PANCRA_LOG=${PANCRA_LOG:-$PANCRA_ROOT/sync.log}
PANCRA_PORT=${PANCRA_PORT:-8443}

# ---- ONE OPERATION AT A TIME ------------------------------------------
#
# THE BOARD-WIDE LOCK every procedure takes before it changes anything, and
# holds until its final health verdict or its rollback. It is a DIRECTORY, not
# a file: mkdir is the create-or-fail primitive that is atomic on every
# filesystem, which `set -C` over a lockfile is not. See srv/deploy/lock.sh for
# the whole argument, including what two unlocked operations did to each other.
#
# It lives beside the pid file rather than in /tmp deliberately: a lock in /tmp
# is cleared by a reboot, and a reboot is not evidence that the operation that
# held it finished -- it is evidence that something went wrong.
PANCRA_LOCK=${PANCRA_LOCK:-$PANCRA_ROOT/deploy.lock}
# HOW OLD A LOCK HAS TO BE BEFORE IT IS ASSUMED DEAD. The holder runs on the
# operator's machine, so the board cannot ask whether it is still alive; an ssh
# that dies mid-deploy would otherwise leave every future operation refused for
# ever, which is an outage this directory inflicted on itself. Nothing here runs
# for an hour -- the longest is a binary copy and a thirty-second health wait --
# so an hour is two orders of magnitude of room. PANCRA_LOCK_BREAK=1 is the
# override for an operator who already knows.
PANCRA_LOCK_STALE=${PANCRA_LOCK_STALE:-3600}

# ---- WHO STARTS IT AGAIN ----------------------------------------------
#
# NOTHING DID. The deployment's whole story about the running process was one
# `setsid ... &` and a pid file, and that is a story with no second chapter:
#
#   * THE SERVER EXITS UNEXPECTEDLY -- a fatal signal, an OOM kill on a board
#     with 56 MB of RAM, a bug -- and it stays exited. The pid file goes on
#     naming the dead pid, so the next `make duosmoke` says so and the next
#     `make duodeploy` restarts it; both of those are a person, at a keyboard,
#     who has noticed. Between the exit and that person, every phone syncing
#     to this board gets nothing, for as long as it takes.
#   * THE BOARD REBOOTS -- a power cut, a watchdog reset, an operator's
#     `reboot` -- and the server does not come back at all. Nothing in this
#     repository put a line in any startup script; the deploy started the
#     process itself over ssh, and a process started over ssh is not a service.
#     The board comes up, the front door forwards to a port nothing is
#     listening on, and it stays that way until somebody deploys by hand.
#
# So this section says WHO restarts it, and PANCRA_SUPERVISOR is the same kind
# of declaration PANCRA_FRONT is: a fact about the deployment that has to be
# written down rather than assumed, because the board is not a machine this
# repository can interrogate.
#
#   watchdog   the default, and deliberately the one that needs NOTHING from
#              the board: no init system, no root, no systemd, no cron. It is
#              srv/deploy/supervise.sh, installed beside the server, launched
#              detached by the deploy and again at boot by PANCRA_BOOT_HOOK.
#              It polls, it restarts what is gone, and it backs off.
#   none       nothing supervises the server. An honest, stated choice -- for
#              a board where something else already does the job -- and the
#              deploy says so out loud rather than implying a safety net that
#              is not there.
#
# WHY NOT A UNIT FILE BY DEFAULT. The board this deployment exists for is a
# Milk-V Duo running a buildroot-style image with BusyBox init: there is no
# `systemctl`, and nothing in this repository can prove what any OTHER board
# runs. A supervisor that assumed systemd would be a deployment that works on
# the maintainer's laptop and not on the hardware. The watchdog assumes only a
# POSIX shell -- and a board that DOES have a service manager can be given one:
# point PANCRA_SUPERVISOR at `none`, and let that manager run supervise.sh (not
# the server: see srv/deploy/start.sh for why the start command exists exactly
# once).
PANCRA_SUPERVISOR=${PANCRA_SUPERVISOR:-watchdog}

# WHERE THE WATCHDOG LIVES ON THE BOARD. Copied by the deploy, like the server
# itself, so it is never older than the procedure that installed it.
PANCRA_SUPERVISE=${PANCRA_SUPERVISE:-$PANCRA_ROOT/supervise.sh}
# ...AND EVERYTHING IT NEEDS TO KNOW, in one generated file. The watchdog runs
# on the board, where this contract does not exist, so the deploy transcribes
# the values it needs into this file -- INCLUDING the start command itself,
# emitted by start.sh's start_template. That is what keeps one definition of
# the start: the board gets a copy that was GENERATED from it, never a second
# copy somebody has to remember to update.
PANCRA_SUPERVISE_ENV=${PANCRA_SUPERVISE_ENV:-$PANCRA_ROOT/supervise.env}
PANCRA_SUPERVISE_PID=${PANCRA_SUPERVISE_PID:-$PANCRA_ROOT/supervise.pid}
# ITS OWN LOG, not the server's. sync.log is read by health.sh as a sequence of
# starts delimited by `=== pancra <tag> ===` banners, and a watchdog writing
# commentary between a banner and its readiness line would be putting its own
# words inside the evidence somebody else is reading. (Neither log is rotated
# yet -- that is its own item.)
PANCRA_SUPERVISE_LOG=${PANCRA_SUPERVISE_LOG:-$PANCRA_ROOT/supervise.log}
# HOW OFTEN IT LOOKS. Seconds. Cheap: a `kill -0` and, only when the pid or the
# installed binary has changed, two sha256s.
PANCRA_SUPERVISE_INTERVAL=${PANCRA_SUPERVISE_INTERVAL:-5}
# HOW LONG A START HAS TO PROVE ITSELF before it counts as failed -- the same
# thirty seconds wait_healthy_since gives a deploy, for the same reason.
PANCRA_SUPERVISE_READY=${PANCRA_SUPERVISE_READY:-30}
# THE CEILING ON THE BACKOFF, in seconds. A server that will not start -- a
# certificate it refuses, a database from a newer build -- must not be
# restarted in a tight loop: on a 56 MB board that is a second failure on top
# of the first, and it fills the log with the same paragraph until the
# filesystem is full. The delay doubles from the interval up to this, and stops
# there rather than growing without bound, because the cause is usually fixed
# from outside (ntpd sets the clock, an operator replaces a pem) and the
# service should come back within minutes of that, not hours.
PANCRA_SUPERVISE_BACKOFF=${PANCRA_SUPERVISE_BACKOFF:-300}
# HOW LONG A DELIBERATE STOP IS OBEYED. See PANCRA_DOWN below: a deploy, a
# rotation or a restore stops the server on purpose, and a watchdog that raced
# them would be worse than no watchdog at all. But an operation that DIES
# between its stop and its start (the ssh drops, the operator's laptop closes)
# leaves that marker behind, and obeying it for ever would turn a supervisor
# into the thing that keeps the board down. Ten minutes is two orders of
# magnitude more than any stop-to-start window here.
PANCRA_SUPERVISE_GRACE=${PANCRA_SUPERVISE_GRACE:-600}

# THE "STOPPED ON PURPOSE" MARKER. Written by stop_block and removed by
# start_block (srv/deploy/start.sh), so every procedure that stops the service
# raises it without having to remember to -- there is exactly one stop and
# exactly one start in this directory, and this is part of both.
#
# It is a file with the board's clock in it, so a marker left by an operation
# that never finished can be aged and eventually ignored (PANCRA_SUPERVISE_GRACE).
PANCRA_DOWN=${PANCRA_DOWN:-$PANCRA_ROOT/service.down}

# ---- ...AND AFTER A REBOOT ---------------------------------------------
#
# THE BOARD'S OWN STARTUP SCRIPT, into which the deploy installs one guarded,
# sentinel-delimited block that launches the watchdog. `unset` is the honest
# default, exactly as it is for the front door: this repository cannot discover
# how a board it has never seen starts things, and a deployment that guessed
# `/etc/init.d/` or `systemctl enable` would be a procedure that silently does
# nothing on the hardware it was written for.
#
# On the Milk-V Duo this deployment targets, that chain is
# inittab -> rcS -> /etc/init.d/S99user -> /mnt/system/auto.sh, which finally
# runs a script of the login user's own -- and the LAST of those is the right
# place: it needs no root, it survives an image update, and it is the file the
# board's other user service is already started from.
#
# The block is installed at the TOP of that file (after any `#!` line) rather
# than appended, and that is not a style choice: a startup script that ends by
# handing the process over with `exec` never reaches an appended line, and the
# board's does. See srv/deploy/README.md, "Supervision and boot".
PANCRA_BOOT_HOOK=${PANCRA_BOOT_HOOK:-unset}
# The certificate the server terminates TLS with. Rotation is a file swap and
# a restart, which is `make duorotate` (rotate.sh); see README.md.
PANCRA_CERT=${PANCRA_CERT:-$PANCRA_ROOT/cert.pem}
PANCRA_KEY=${PANCRA_KEY:-$PANCRA_ROOT/key.pem}

# ---- THE FRONT DOOR: how the public URL reaches this listener ---------
#
# THE SERVER LISTENS ON 8443 AND THE WORLD ASKS FOR 443, and until now nothing
# in this repository said what closes that gap. Three places assumed different
# answers: the top-level README said the server needs "no proxy", the health
# checks probe https://pancra.org (port 443), and the migration procedure in
# README.md step 4 says "point the reverse proxy at the new port". At most one
# of those can be true, and an operator reading any one of them alone gets a
# wrong picture of what they are about to change.
#
# The binary genuinely needs no proxy TO RUN: it terminates TLS itself with
# PANCRA_CERT/PANCRA_KEY and serves HTTP/1.1 directly. That is what the README
# means and it stays true. What it does not say is how a request to 443 on the
# public name arrives at 8443 on the board -- and something does, or the URL
# check below could never pass.
#
# So it is DECLARED here, beside everything else about the deployment, and the
# procedures reference it rather than assuming:
#
#   direct       the board listens on the public port itself; PANCRA_PORT is
#                the public port and nothing forwards.
#   nat          a router forwards <public>:443 to <board>:PANCRA_PORT. The
#                forward is part of the deployment: a port change means
#                changing it, and a rollback to a build on another port means
#                changing it back.
#   proxy:<name> a named reverse proxy terminates TLS for the public name and
#                forwards to PANCRA_PORT. It, not this server, owns the public
#                certificate -- so PANCRA_CERT/PANCRA_KEY here are the BACKEND
#                pair and rotating the public one is that component's job.
#
# WHO OWNS IT is the point of PANCRA_FRONT_OWNER: the deploy, rollback, backup
# and failure procedures in README.md all say what this component needs at
# each step, and "nobody wrote it down" is how a rollback comes up healthy on
# the board and unreachable from outside.
#
# `unset` is the honest default for a checkout that has not been told. It is
# not a working configuration: deploycheck requires a real value before a
# deployment is described as verified.
PANCRA_FRONT=${PANCRA_FRONT:-unset}
PANCRA_FRONT_OWNER=${PANCRA_FRONT_OWNER:-unset}
# The port the public URL is served on, which is what the front door maps FROM.
# Equal to PANCRA_PORT only when PANCRA_FRONT is `direct`.
PANCRA_PUBLIC_PORT=${PANCRA_PUBLIC_PORT:-443}

# THE BACKEND, ADDRESSED DIRECTLY. PANCRA_URL goes through the front door;
# this one does not. Two facts that were only ever checked separately -- "a
# process is alive on the board" and "the public name serves a page with the
# marker" -- do not have to be about the same server, and on a rollback or a
# port change they routinely are not. Asking the listener itself, and then the
# public route, is what ties them together: both answering means the route
# actually arrives here.
#
# --insecure is used for this one, deliberately: the backend certificate is
# issued for the PUBLIC name, so verifying the hostname of a direct connection
# to the board would fail on a perfectly correct deployment. What is being
# established here is identity of the BACKEND, not of the certificate; the
# public probe is what exercises TLS as a stranger sees it.
# Overridable for a board whose listener is not reachable on the loopback --
# but the default is deliberately NOT built out of PANCRA_HOST. That is an ssh
# destination, and ssh reads ~/.ssh/config while curl does not, so a URL made
# from it can point somewhere ssh never went. health.sh asks from the board.
PANCRA_BACKEND_PATH=${PANCRA_BACKEND_PATH:-/login}
# The probe itself, run ON THE BOARD. A command rather than a URL because the
# deployment drill's "board" is a directory and its "server" writes a file --
# it has to be able to answer the same question a different way, or the one
# check that ties the public route to this process would be the one check
# nothing exercises.
PANCRA_BACKEND_PROBE=${PANCRA_BACKEND_PROBE:-curl --fail --silent --show-error --insecure --max-time 20 https://127.0.0.1:$PANCRA_PORT$PANCRA_BACKEND_PATH}

# WHAT HEALTHY LOOKS LIKE. The log line the server prints once it is
# listening, and a public URL that must answer with a page containing the
# marker. Both are asserted after a deploy and by the smoke test.
#
# THE URL GOES THROUGH THE FRONT DOOR, deliberately: a check that talked to
# PANCRA_PORT on the board would pass while the public name was broken, which
# is the failure an operator most needs to hear about and the one a local
# probe cannot see.
PANCRA_READY_LINE=${PANCRA_READY_LINE:-listening on port $PANCRA_PORT}
# THE NAME THIS SERVER IS KNOWN BY FROM OUTSIDE, as a host[:port] with no
# scheme. The server needs it for share links, and it cannot ask the request:
# the settings page used to build invitation links out of the request's `Host`
# header, so an authenticated request arriving with someone else's name --
# through a permissive proxy, or a second name pointed at this address --
# rendered a link carrying a LIVE SINGLE-USE TOKEN at that name. The owner
# copies what the page shows and sends the token to another domain.
#
# It is the same fact PANCRA_URL states for the health check; kept separate
# because that one is a whole URL with a path and this one is only the origin.
PANCRA_ORIGIN=${PANCRA_ORIGIN:-pancra.org}
PANCRA_URL=${PANCRA_URL:-https://pancra.org/login}
PANCRA_URL_MARKER=${PANCRA_URL_MARKER:-sign in}

# The local artifact a deploy installs and the smoke test compares against.
# `make duo` and `make duodeploy` pass this in, computed from the toolchain
# prefix so the build and the deploy cannot disagree; the default is here for a
# by-hand run of either script.
PANCRA_LOCAL_BIN=${PANCRA_LOCAL_BIN:-build/srv-riscv64-linux-musl/sync}
# The machine type that binary must be, checked before anything is copied: a
# native build pushed to the board is an "Exec format error" at startup, which
# is a dead service rather than a failed deploy.
PANCRA_ARCH=${PANCRA_ARCH:-RISC-V}

# THE BINARY THAT VERIFIES A BACKUP BEFORE IT IS TRUSTED, and it runs HERE, not
# on the board -- so it is the NATIVE build and emphatically not
# PANCRA_LOCAL_BIN, which is the riscv64 artifact this machine cannot execute.
# restore.sh spelled `build/srv/sync` out inline, which made the verifier the
# one thing a deployment uses that was not described here; a relative value is
# taken from the top of the repository, an absolute one as given.
#
# Read by BOTH restore.sh and backup.sh: they run the same binary for the same
# reason, on a copy they have just handled, and a contract covering one of two
# users is the half that drifts.
#
# ROOTED AT $HERE, not relative. The default used to be `build/srv/sync`, which
# resolves against the CALLER'S working directory -- so restore.sh worked only
# when invoked from the repository root, and pointing backup.sh at it would have
# made a path that had been explicitly rooted newly CWD-dependent. An override
# is used exactly as given, so an absolute path elsewhere still works.
PANCRA_VERIFY_BIN=${PANCRA_VERIFY_BIN:-$HERE/build/srv/sync}
